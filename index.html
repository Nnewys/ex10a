<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bike Size Finder</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="validate.js"></script> <!-- ลิงก์ไปที่ไฟล์ JavaScript -->
</head>
<body>

<div class="container mt-3">
  <h2>Calculate your bike size</h2><br>
  
  <form id="bikeForm" onsubmit="return validateForm()">
    <div class="mb-3 mt-3">
      <label class="form-label"><span style="color:red">*</span>Bike type</label>&nbsp;&nbsp;<br>
      <input type="radio" class="form-check-input" id="btype1" name="btypeRad" value="1" checked>&nbsp; Mountain bike &nbsp;&nbsp;
      <input type="radio" class="form-check-input" id="btype2" name="btypeRad" value="2">&nbsp; Road bike
    </div>
    <div class="mb-3 mt-3">
        <label for="fname" class="form-label"><span style="color:red">*</span>Height (cm)
          &nbsp;&nbsp;<img src="./info_btn.png" width="20" height="20"
          onClick="(function(){
            var modal1 = new bootstrap.Modal(document.getElementById('heightModal'));
            document.getElementById('height-img').src='./height.jpeg';
            modal1.toggle();
          })();return false;"/></label>
        <input type="text" class="form-control" id="myHeight" name="myHeight"/>
    </div>
    <div class="mb-3 mt-3">
        <label for="lname" class="form-label"><span style="color:red">*</span>Inseam (cm)
        &nbsp;&nbsp;<img src="./info_btn.png" width="20" height="20"
        onClick="(function(){
          var modal2 = new bootstrap.Modal(document.getElementById('inseamModal'));
          document.getElementById('inseam-img').src='./inseam.jpeg';
          modal2.toggle();
        })();return false;"/></label>
        <input type="text" class="form-control" id="myInseam" name="myInseam"/>
    </div>
    <button type="submit" class="btn btn-primary">Calculate</button>
    <button type="reset" class="btn btn-primary">Reset</button>
  </form><br><br>
</div>

<!-- Modal for Result -->
<div class="modal fade" id="resultModal" tabindex="-1" aria-labelledby="resultModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="resultModalLabel">Bike Size Result</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="resultMessage"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal for Height Explanation -->
<div class="modal fade" id="heightModal" tabindex="-1" aria-labelledby="heightModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="heightModalLabel">How to Measure Height</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <img src="./height.jpeg" id="height-img" width="470" height="250"/>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal for Inseam Explanation -->
<div class="modal fade" id="inseamModal" tabindex="-1" aria-labelledby="inseamModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="inseamModalLabel">How to Measure Inseam</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <img src="./inseam.jpeg" id="inseam-img" width="470" height="250"/>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="sizeCal.js"></script>

</body>
</html>
